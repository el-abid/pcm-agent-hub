<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#10141D"/>
    </linearGradient>
    <linearGradient id="hub" x1="320" y1="390" x2="520" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="final" x1="1410" y1="540" x2="1570" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2533" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="60" y="64" fill="#F1F5F9" font-size="30" font-weight="700" letter-spacing="0.5">PCM AGENT · WORKFLOW</text>
  <text x="60" y="94" fill="#94A3B8" font-size="15">Hub interopérable A2A + MCP · Portes palières de quai</text>

  <rect x="1260" y="44" width="140" height="30" rx="15" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.6"/>
  <text x="1330" y="64" fill="#67E8F9" font-size="11" text-anchor="middle" font-weight="600">A2A · JSON-RPC</text>
  <rect x="1415" y="44" width="130" height="30" rx="15" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.6"/>
  <text x="1480" y="64" fill="#C4B5FD" font-size="11" text-anchor="middle" font-weight="600">MCP · 31 TOOLS</text>

  <!-- User -->
  <rect x="50" y="390" width="190" height="110" rx="14" fill="#151A24" stroke="#334155"/>
  <text x="70" y="420" fill="#94A3B8" font-size="11" letter-spacing="1.2">OPÉRATEUR PCM</text>
  <text x="70" y="452" fill="#F1F5F9" font-size="18" font-weight="700">QUESTION PCM</text>
  <text x="70" y="476" fill="#94A3B8" font-size="12">Porte bloquée · quai 2</text>

  <path d="M 240 445 L 312 445" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fan-out hub -->
  <rect x="320" y="390" width="200" height="110" rx="16" fill="url(#hub)" filter="url(#glow)"/>
  <text x="340" y="438" fill="#FFFFFF" font-size="19" font-weight="700">FAN-OUT A2A</text>
  <text x="340" y="464" fill="#DBEAFE" font-size="12">4 agents en parallèle</text>

  <!-- Branches -->
  <path d="M 520 445 C 560 445, 560 180, 672 180" stroke="#3B82F6" stroke-width="2.2" fill="none" opacity="0.9" marker-end="url(#arrow)"/>
  <path d="M 520 445 C 560 445, 560 330, 672 330" stroke="#22D3EE" stroke-width="2.2" fill="none" opacity="0.9" marker-end="url(#arrow)"/>
  <path d="M 520 445 C 560 445, 560 480, 672 480" stroke="#F59E0B" stroke-width="2.2" fill="none" opacity="0.9" marker-end="url(#arrow)"/>
  <path d="M 520 445 C 560 445, 560 630, 672 630" stroke="#A78BFA" stroke-width="2.2" fill="none" opacity="0.9" marker-end="url(#arrow)"/>

  <!-- Gateway bar -->
  <rect x="590" y="128" width="32" height="624" rx="16" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.8"/>
  <text x="606" y="440" fill="#67E8F9" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90 606 440)" letter-spacing="1.1">A2A GATEWAY · AGENT CARDS</text>

  <!-- Agent cards -->
  <g>
    <rect x="680" y="130" width="300" height="100" rx="12" fill="#141A24" stroke="#2A3446"/>
    <rect x="680" y="130" width="5" height="100" rx="2.5" fill="#3B82F6"/>
    <circle cx="712" cy="168" r="15" fill="#1E3A8A"/>
    <text x="712" y="174" fill="#93C5FD" font-size="14" font-weight="700" text-anchor="middle">D</text>
    <text x="738" y="168" fill="#F1F5F9" font-size="17" font-weight="700">DOCUMENTATION</text>
    <text x="738" y="192" fill="#94A3B8" font-size="12">Procédures E1-E4 · RAG agentique</text>
    <text x="950" y="152" fill="#60A5FA" font-size="10" text-anchor="end" font-weight="600">A2A</text>
  </g>
  <g>
    <rect x="680" y="280" width="300" height="100" rx="12" fill="#141A24" stroke="#2A3446"/>
    <rect x="680" y="280" width="5" height="100" rx="2.5" fill="#22D3EE"/>
    <circle cx="712" cy="318" r="15" fill="#164E63"/>
    <text x="712" y="324" fill="#A5F3FC" font-size="14" font-weight="700" text-anchor="middle">E</text>
    <text x="738" y="318" fill="#F1F5F9" font-size="17" font-weight="700">ÉQUIPEMENTS</text>
    <text x="738" y="342" fill="#94A3B8" font-size="12">EQ-PSD-ALIM · CTRL · OBS</text>
    <text x="950" y="302" fill="#67E8F9" font-size="10" text-anchor="end" font-weight="600">A2A</text>
  </g>
  <g>
    <rect x="680" y="430" width="300" height="100" rx="12" fill="#141A24" stroke="#2A3446"/>
    <rect x="680" y="430" width="5" height="100" rx="2.5" fill="#F59E0B"/>
    <circle cx="712" cy="468" r="15" fill="#78350F"/>
    <text x="712" y="474" fill="#FCD34D" font-size="14" font-weight="700" text-anchor="middle">M</text>
    <text x="738" y="468" fill="#F1F5F9" font-size="17" font-weight="700">MODES DÉGRADÉS</text>
    <text x="738" y="492" fill="#94A3B8" font-size="12">D1 · D2 · D3 · décision PCC</text>
    <text x="950" y="452" fill="#FCD34D" font-size="10" text-anchor="end" font-weight="600">A2A</text>
  </g>
  <g>
    <rect x="680" y="580" width="300" height="100" rx="12" fill="#141A24" stroke="#2A3446"/>
    <rect x="680" y="580" width="5" height="100" rx="2.5" fill="#A78BFA"/>
    <circle cx="712" cy="618" r="15" fill="#4C1D95"/>
    <text x="712" y="624" fill="#DDD6FE" font-size="14" font-weight="700" text-anchor="middle">A</text>
    <text x="738" y="618" fill="#F1F5F9" font-size="17" font-weight="700">ANNUAIRE</text>
    <text x="738" y="642" fill="#94A3B8" font-size="12">Contacts · horaires · escalade</text>
    <text x="950" y="602" fill="#C4B5FD" font-size="10" text-anchor="end" font-weight="600">A2A</text>
  </g>

  <!-- Convergence bus -->
  <path d="M 980 180 L 1030 180 L 1030 630 L 980 630" stroke="none" fill="none"/>
  <path d="M 980 180 L 1030 180" stroke="#64748B" stroke-width="1.6"/>
  <path d="M 980 330 L 1030 330" stroke="#64748B" stroke-width="1.6"/>
  <path d="M 980 480 L 1030 480" stroke="#64748B" stroke-width="1.6"/>
  <path d="M 980 630 L 1030 630" stroke="#64748B" stroke-width="1.6"/>
  <path d="M 1030 180 L 1030 630" stroke="#64748B" stroke-width="1.6"/>
  <path d="M 1030 265 L 1072 265" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Combine -->
  <rect x="1080" y="220" width="300" height="90" rx="12" fill="#141A24" stroke="#A78BFA"/>
  <text x="1100" y="258" fill="#F1F5F9" font-size="18" font-weight="700">COMBINE</text>
  <text x="1100" y="284" fill="#94A3B8" font-size="12">Question + 4 réponses</text>

  <!-- Critique -->
  <path d="M 1230 310 L 1230 322" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1080" y="330" width="300" height="90" rx="12" fill="#141A24" stroke="#F59E0B"/>
  <text x="1100" y="368" fill="#F1F5F9" font-size="18" font-weight="700">CRITIQUE</text>
  <text x="1100" y="394" fill="#94A3B8" font-size="12">Sécurité · ancrage · placeholders</text>

  <!-- Revision -->
  <path d="M 1230 420 L 1230 432" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1080" y="440" width="300" height="90" rx="12" fill="#141A24" stroke="#60A5FA"/>
  <text x="1100" y="478" fill="#F1F5F9" font-size="18" font-weight="700">RÉVISION</text>
  <text x="1100" y="504" fill="#94A3B8" font-size="12">Correction bornée · sources</text>

  <!-- Contacts -->
  <path d="M 1230 530 L 1230 542" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1080" y="550" width="300" height="90" rx="12" fill="#141A24" stroke="#34D399"/>
  <text x="1100" y="588" fill="#F1F5F9" font-size="18" font-weight="700">CONTACTS</text>
  <text x="1100" y="614" fill="#94A3B8" font-size="12">06 00 00 00 01 · 02 · PCC 4000</text>

  <!-- Final -->
  <path d="M 1380 595 L 1402 595" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1410" y="540" width="160" height="110" rx="16" fill="url(#final)" filter="url(#glow)"/>
  <path d="M 1440 590 l 10 10 l 18 -22" stroke="#ECFDF5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1435" y="616" fill="#FFFFFF" font-size="14" font-weight="700">RÉPONSE</text>
  <text x="1435" y="634" fill="#FFFFFF" font-size="14" font-weight="700">FINALE</text>

  <!-- MongoDB -->
  <path d="M 1240 640 C 1300 700, 1380 730, 1450 748" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="6 6" fill="none" opacity="0.8"/>
  <text x="1290" y="690" fill="#67E8F9" font-size="11" font-weight="600">MCP · LOG</text>
  <ellipse cx="1490" cy="748" rx="80" ry="18" fill="#0F2A3A" stroke="#22D3EE" stroke-opacity="0.7"/>
  <rect x="1410" y="748" width="160" height="72" fill="#0F2A3A" stroke="#22D3EE" stroke-opacity="0.7"/>
  <ellipse cx="1490" cy="820" rx="80" ry="18" fill="#0F2A3A" stroke="#22D3EE" stroke-opacity="0.7"/>
  <text x="1490" y="784" fill="#A5F3FC" font-size="14" font-weight="700" text-anchor="middle">MONGODB ATLAS</text>
  <text x="1490" y="804" fill="#67E8F9" font-size="10" text-anchor="middle">pcm_agent.interactions</text>

  <!-- Footer -->
  <text x="60" y="852" fill="#64748B" font-size="11">A2A : JSON-RPC 2.0 · AgentCards · 8 agents</text>
  <text x="420" y="852" fill="#64748B" font-size="11">MCP : mongodb-atlas-http · 31 outils</text>
  <text x="780" y="852" fill="#64748B" font-size="11">Fan-out déterministe · critique + révision avant réponse</text>
  <text x="1540" y="852" fill="#475569" font-size="10" text-anchor="end">PCM · J35</text>
</svg>
